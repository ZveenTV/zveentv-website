<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta name="description" content="ZveenTV auf Twitch — Gaming. Gute Laune. Chaos mit Plan. Komm rein und fühl dich wie zuhause.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="ZveenTV">
<meta property="og:title" content="ZveenTV — Home">
<meta property="og:description" content="Gaming. Gute Laune. Chaos mit Plan. Komm rein, schnapp dir einen Platz und fühl dich wie zuhause.">
<meta property="og:image" content="https://DEINE-DOMAIN.tld/assets/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:url" content="https://DEINE-DOMAIN.tld/index.html">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="ZveenTV — Home">
<meta name="twitter:description" content="Gaming. Gute Laune. Chaos mit Plan. Komm rein, schnapp dir einen Platz und fühl dich wie zuhause.">
<meta name="twitter:image" content="https://DEINE-DOMAIN.tld/assets/og-image.png">
<link rel="icon" href="assets/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Manrope:wght@400;500;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="home-bg" aria-hidden="true"></div>

<header class="nav">
  <div class="nav-inner">
    <div class="brand-group">
      <a href="index.html" class="brand">
        <img src="assets/logo.png" alt="ZveenTV Logo">
        <span class="brand-name">ZVEEN<span class="hl">TV</span></span>
      </a>
      <span class="live-badge-nav" id="liveBadgeNav">
        <span class="live-badge-dot" aria-hidden="true"></span>
        <span id="liveBadgeText">Live</span>
      </span>
    </div>
    <nav class="links" id="navLinks" aria-label="Hauptnavigation">
      <a href="index.html" class="active">Home</a>
      <a href="about.html">Über mich</a>
      <a href="equipment.html">Equipment</a>
      <a href="clips.html">Clips</a>
      <a href="community.html">Community</a>
    </nav>
    <div class="nav-cta">
      <a class="btn ghost" href="https://discord.com/invite/sVWuKPpkG8" target="_blank" rel="noopener">Discord</a>
      <a class="btn primary" href="https://www.twitch.tv/zveentv" target="_blank" rel="noopener">Auf Twitch</a>
    </div>
    <button class="nav-toggle" id="navToggle" aria-label="Menü öffnen" aria-expanded="false">☰</button>
  </div>
</header>

<main id="top">

  <section class="hero" style="padding-top:0;">
    <div class="hero-inner">
      <img src="assets/logo.png" alt="ZveenTV Logo" style="width:150px; height:150px; border-radius:50%; border:2px solid var(--magenta-bright); margin-bottom:28px;">
      <h1 style="font-size:clamp(2.4rem, 6vw, 3.6rem);">ZVEEN<span>TV</span></h1>
      <p class="tagline">Gaming. Gute Laune. Chaos mit Plan. Komm rein, schnapp dir einen Platz und fühl dich wie zuhause.</p>
      <div class="twitch-live-wrap" id="twitchEmbed">
        <div class="twitch-fallback">
          <a href="https://www.twitch.tv/zveentv" target="_blank" rel="noopener">Live-Player auf Twitch öffnen →</a>
        </div>
      </div>
    </div>
  </section>

</main>

<footer>
  <div class="content-wide footer-inner">
    <span>© 2026 ZveenTV</span>
    <span>Gaming. Gute Laune. Chaos mit Plan.</span>
  </div>
</footer>

<script>
  const navToggle = document.getElementById('navToggle');
  const navLinks = document.getElementById('navLinks');
  navToggle.addEventListener('click', () => {
    const isOpen = navLinks.classList.toggle('open');
    navToggle.setAttribute('aria-expanded', isOpen);
  });

  fetch('/.netlify/functions/twitch-status')
    .then(res => res.json())
    .then(data => {
      if (data.live) {
        const badge = document.getElementById('liveBadgeNav');
        const text = document.getElementById('liveBadgeText');
        if (badge && text) {
          text.textContent = `Live · ${data.viewers} Zuschauer`;
          badge.classList.add('is-live');
        }
      }
    })
    .catch(() => { /* Badge bleibt einfach ausgeblendet, kein Problem */ });

  const twitchContainer = document.getElementById('twitchEmbed');
  if (twitchContainer) {
    const hostname = window.location.hostname || 'localhost';
    const iframe = document.createElement('iframe');
    iframe.src = `https://player.twitch.tv/?channel=zveentv&parent=${hostname}&muted=true`;
    iframe.setAttribute('allowfullscreen', 'true');
    iframe.setAttribute('scrolling', 'no');
    iframe.setAttribute('frameborder', '0');
    iframe.setAttribute('title', 'ZveenTV Live-Player');
    twitchContainer.innerHTML = '';
    twitchContainer.appendChild(iframe);
  }
</script>

</body>
</html>
